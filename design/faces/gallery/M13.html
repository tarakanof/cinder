<div class="chrome"><h1>Bot, listening</h1><p>M13.dc.html · <a href="index.html">all faces</a></p><div id="controls"></div></div>
<script>
const SCHEMA = {"mood": {"editor": "enum", "options": ["idle", "working", "waiting", "done", "error"], "default": "working"}, "$preview": {"width": 466, "height": 466}};
const TEMPLATE = "<div style=\"width: 466px; height: 466px; position: relative; overflow: hidden; border-radius: 50%; background: #000000; color: #F4F4F2; font-family: Montserrat, 'Avenir Next', 'Segoe UI', sans-serif; font-weight: 500\">\n<svg viewBox=\"0 0 466 466\" width=\"466\" height=\"466\" role=\"img\" aria-label=\"The bot wearing headphones, eyes bobbing to the beat, music notes floating up; listening to Glass Harbor\" style=\"position: absolute; left: 0; top: 0;\">\n<circle cx=\"233\" cy=\"233\" r=\"196\" style=\"fill: none; stroke: {{mood}}; stroke-width: 4.5\"><\/circle><path id=\"mbot-label-arc\" d=\"M 57 233 A 176 176 0 0 0 409 233\" style=\"fill: none; stroke: none\"><\/path><text style=\"font-family: Montserrat, 'Avenir Next', 'Segoe UI', sans-serif; font-weight: 500; font-size: 30px; letter-spacing: 1px; fill: #F4F4F2; text-anchor: middle\"><textPath href=\"#mbot-label-arc\" startOffset=\"50%\">GLASS HARBOR<\/textPath><\/text><g style=\"animation: wxphones 6s linear infinite\"><g style=\"animation: wxheadbob 0.6s ease-in-out infinite\"><path d=\"M 112 236 A 121 121 0 0 1 354 236\" style=\"fill: none; stroke: #F2A07E; stroke-width: 12; stroke-linecap: round\"><\/path><rect x=\"96\" y=\"214\" width=\"36\" height=\"72\" rx=\"16\" style=\"fill: #F2A07E\"><\/rect><rect x=\"104\" y=\"226\" width=\"8\" height=\"48\" rx=\"4\" style=\"fill: #000000; opacity: 0.25\"><\/rect><rect x=\"334\" y=\"214\" width=\"36\" height=\"72\" rx=\"16\" style=\"fill: #F2A07E\"><\/rect><rect x=\"354\" y=\"226\" width=\"8\" height=\"48\" rx=\"4\" style=\"fill: #000000; opacity: 0.25\"><\/rect><\/g><\/g><g style=\"--dx: -16px; opacity: 0; animation: wxnote 2.4s ease-out 0s infinite\"><g transform=\"translate(104 200)\"><ellipse cx=\"0\" cy=\"0\" rx=\"6.5\" ry=\"5\" transform=\"rotate(-20)\" style=\"fill: #F2A07E\"><\/ellipse><line x1=\"5.5\" y1=\"-2\" x2=\"5.5\" y2=\"-22\" style=\"stroke: #F2A07E; stroke-width: 3; stroke-linecap: round\"><\/line><path d=\"M 5.5 -22 Q 14 -18 12 -9\" style=\"fill: none; stroke: #F2A07E; stroke-width: 3; stroke-linecap: round\"><\/path><\/g><\/g><g style=\"--dx: 18px; opacity: 0; animation: wxnote 2.4s ease-out -0.8s infinite\"><g transform=\"translate(360 196)\"><ellipse cx=\"0\" cy=\"0\" rx=\"6.5\" ry=\"5\" transform=\"rotate(-20)\" style=\"fill: #F2A07E\"><\/ellipse><line x1=\"5.5\" y1=\"-2\" x2=\"5.5\" y2=\"-22\" style=\"stroke: #F2A07E; stroke-width: 3; stroke-linecap: round\"><\/line><path d=\"M 5.5 -22 Q 14 -18 12 -9\" style=\"fill: none; stroke: #F2A07E; stroke-width: 3; stroke-linecap: round\"><\/path><\/g><\/g><g style=\"--dx: -8px; opacity: 0; animation: wxnote 2.4s ease-out -1.6s infinite\"><g transform=\"translate(118 190)\"><ellipse cx=\"0\" cy=\"0\" rx=\"6.5\" ry=\"5\" transform=\"rotate(-20)\" style=\"fill: #F2A07E\"><\/ellipse><line x1=\"5.5\" y1=\"-2\" x2=\"5.5\" y2=\"-22\" style=\"stroke: #F2A07E; stroke-width: 3; stroke-linecap: round\"><\/line><path d=\"M 5.5 -22 Q 14 -18 12 -9\" style=\"fill: none; stroke: #F2A07E; stroke-width: 3; stroke-linecap: round\"><\/path><\/g><\/g><g style=\"--dx: 10px; opacity: 0; animation: wxnote 2.4s ease-out -2.0s infinite\"><g transform=\"translate(348 186)\"><ellipse cx=\"0\" cy=\"0\" rx=\"6.5\" ry=\"5\" transform=\"rotate(-20)\" style=\"fill: #F2A07E\"><\/ellipse><line x1=\"5.5\" y1=\"-2\" x2=\"5.5\" y2=\"-22\" style=\"stroke: #F2A07E; stroke-width: 3; stroke-linecap: round\"><\/line><path d=\"M 5.5 -22 Q 14 -18 12 -9\" style=\"fill: none; stroke: #F2A07E; stroke-width: 3; stroke-linecap: round\"><\/path><\/g><\/g>\n<\/svg>\n<div style=\"position: absolute; left: 152px; top: 236px; width: 68px; height: 36px; border-radius: 18px; background: #F4F4F2; transform-origin: 50% 100%; animation: wxbeat 0.6s ease-in-out infinite\"><\/div>\n<div style=\"position: absolute; left: 246px; top: 236px; width: 68px; height: 36px; border-radius: 18px; background: #F4F4F2; transform-origin: 50% 100%; animation: wxbeat 0.6s ease-in-out infinite\"><\/div>\n<\/div>";

let __schedule = () => {};
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(u) {
    const next = typeof u === 'function' ? u(this.state, this.props) : u;
    this.state = Object.assign({}, this.state, next);
    __schedule();
  }
}

class Component extends DCLogic {
renderVals() {
const colors = { idle: '#888888', working: '#2EE85E', waiting: '#FFC14D', done: '#4FA9FF', error: '#FF3A3A' };
return { mood: colors[this.props.mood] || '#2EE85E' };
}
}

(function () {
  const root = document.getElementById('face');
  const q = new URLSearchParams(location.search);
  if (q.get('embed') === '1') document.body.classList.add('embed');
  const coerce = (d, v) => d.editor === 'boolean' ? (v === true || v === 'true' || v === '1') : d.editor === 'range' ? Number(v) : v;
  const props = {};
  for (const [k, d] of Object.entries(SCHEMA)) {
    if (k[0] === '$') continue;
    props[k] = q.has(k) ? coerce(d, q.get(k)) : d.default;
  }
  const comp = typeof Component === 'function' ? new Component(Object.assign({}, props)) : null;
  let last = null, pending = false;
  const render = () => {
    pending = false;
    const vals = Object.assign({}, props, comp && comp.renderVals ? (comp.renderVals() || {}) : {});
    const out = TEMPLATE.replace(/\{\{(\w+)\}\}/g, (m, k) => (vals[k] == null ? '' : String(vals[k])));
    if (out !== last) { root.innerHTML = out; last = out; }
  };
  __schedule = () => { if (!pending) { pending = true; Promise.resolve().then(render); } };
  render();
  if (comp && comp.componentDidMount) comp.componentDidMount();
  window.addEventListener('pagehide', () => { if (comp && comp.componentWillUnmount) comp.componentWillUnmount(); });
  const box = document.getElementById('controls');
  const set = (k, v) => {
    props[k] = v;
    if (comp) comp.props = Object.assign({}, props);
    const u = new URL(location.href); u.searchParams.set(k, String(v)); history.replaceState(null, '', u);
    render();
  };
  for (const [k, d] of Object.entries(SCHEMA)) {
    if (k[0] === '$') continue;
    const label = document.createElement('label');
    label.textContent = k + ' ';
    let input;
    if (d.editor === 'enum') {
      input = document.createElement('select');
      for (const o of d.options) { const op = document.createElement('option'); op.value = o; op.textContent = o; input.appendChild(op); }
      input.value = props[k];
      input.onchange = () => set(k, input.value);
    } else if (d.editor === 'boolean') {
      input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!props[k];
      input.onchange = () => set(k, input.checked);
    } else if (d.editor === 'range') {
      input = document.createElement('input'); input.type = 'range';
      input.min = d.min; input.max = d.max; input.step = d.step || 1; input.value = props[k];
      const out = document.createElement('output'); out.textContent = props[k] + (d.unit || '');
      input.oninput = () => { out.textContent = input.value + (d.unit || ''); set(k, Number(input.value)); };
      label.appendChild(input); label.appendChild(out); box.appendChild(label); continue;
    } else continue;
    label.appendChild(input); box.appendChild(label);
  }
  if (!box.children.length) box.textContent = 'No props on this face.';
})();

</script>
