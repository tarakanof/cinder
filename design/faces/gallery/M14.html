<body>

<div class="chrome"><h1>Bot, new track</h1><p>M14.dc.html · <a href="index.html">all faces</a></p><div id="controls"></div></div>
<script>
const SCHEMA = {"mood": {"editor": "enum", "options": ["idle", "working", "waiting", "done", "error"], "default": "working"}, "$preview": {"width": 466, "height": 466}};
const TEMPLATE = "<div style=\"width: 466px; height: 466px; position: relative; overflow: hidden; border-radius: 50%; background: #000000; color: #F4F4F2; font-family: Montserrat, 'Avenir Next', 'Segoe UI', sans-serif; font-weight: 500\">\n<svg viewBox=\"0 0 466 466\" width=\"466\" height=\"466\" role=\"img\" aria-label=\"A new track: a small album circle pops in above the bot, its eyes glance up at it, Paper Moons curving along the bottom\" style=\"position: absolute; left: 0; top: 0;\">\n<circle cx=\"233\" cy=\"233\" r=\"196\" style=\"fill: none; stroke: {{mood}}; stroke-width: 4.5\"><\/circle><g style=\"transform-origin: 233px 132px; opacity: 0; animation: wxpop 6s linear infinite\"><circle cx=\"233\" cy=\"132\" r=\"48\" style=\"fill: #000000\"><\/circle><defs><linearGradient id=\"nskyM14\" x1=\"0\" y1=\"0\" x2=\"0.3\" y2=\"1\"><stop offset=\"0\" stop-color=\"#0B1640\"><\/stop><stop offset=\"0.6\" stop-color=\"#23407A\"><\/stop><stop offset=\"1\" stop-color=\"#3D6BB8\"><\/stop><\/linearGradient><clipPath id=\"nclipM14\"><circle cx=\"233\" cy=\"132\" r=\"45\"><\/circle><\/clipPath><\/defs><g clip-path=\"url(#nclipM14)\"><rect x=\"188\" y=\"87\" width=\"90\" height=\"90\" style=\"fill: url(#nskyM14)\"><\/rect><circle cx=\"210.5\" cy=\"109.5\" r=\"2.0\" style=\"fill: #DDE6FF; opacity: 0.8\"><\/circle><circle cx=\"253.2\" cy=\"105.0\" r=\"1.6\" style=\"fill: #DDE6FF; opacity: 0.8\"><\/circle><circle cx=\"260.0\" cy=\"136.5\" r=\"1.8\" style=\"fill: #DDE6FF; opacity: 0.8\"><\/circle><circle cx=\"205.1\" cy=\"141.0\" r=\"1.4\" style=\"fill: #DDE6FF; opacity: 0.8\"><\/circle><circle cx=\"237.5\" cy=\"98.2\" r=\"1.3\" style=\"fill: #DDE6FF; opacity: 0.8\"><\/circle><mask id=\"cmM14227.6\"><rect x=\"188\" y=\"87\" width=\"90\" height=\"90\" style=\"fill: #FFFFFF\"><\/rect><circle cx=\"237.5\" cy=\"125.8\" r=\"20.7\" style=\"fill: #000000\"><\/circle><\/mask><circle cx=\"227.6\" cy=\"129.8\" r=\"20.7\" mask=\"url(#cmM14227.6)\" style=\"fill: #CFE0FF; opacity: 1\"><\/circle><mask id=\"cmM14250.1\"><rect x=\"188\" y=\"87\" width=\"90\" height=\"90\" style=\"fill: #FFFFFF\"><\/rect><circle cx=\"254.6\" cy=\"149.1\" r=\"9.9\" style=\"fill: #000000\"><\/circle><\/mask><circle cx=\"250.1\" cy=\"150.9\" r=\"9.9\" mask=\"url(#cmM14250.1)\" style=\"fill: #7FA8FF; opacity: 0.9\"><\/circle><mask id=\"cmM14210.5\"><rect x=\"188\" y=\"87\" width=\"90\" height=\"90\" style=\"fill: #FFFFFF\"><\/rect><circle cx=\"213.7\" cy=\"153.2\" r=\"6.3\" style=\"fill: #000000\"><\/circle><\/mask><circle cx=\"210.5\" cy=\"154.5\" r=\"6.3\" mask=\"url(#cmM14210.5)\" style=\"fill: #9FBCFF; opacity: 0.8\"><\/circle><\/g><\/g><g style=\"opacity: 0; animation: wxlabel 6s linear infinite\"><path id=\"mbot-label-arc\" d=\"M 57 233 A 176 176 0 0 0 409 233\" style=\"fill: none; stroke: none\"><\/path><text style=\"font-family: Montserrat, 'Avenir Next', 'Segoe UI', sans-serif; font-weight: 500; font-size: 30px; letter-spacing: 1px; fill: #F4F4F2; text-anchor: middle\"><textPath href=\"#mbot-label-arc\" startOffset=\"50%\">PAPER MOONS<\/textPath><\/text><\/g>\n<\/svg>\n<div style=\"position: absolute; left: 152px; top: 244px; width: 68px; height: 36px; border-radius: 18px; background: #F4F4F2; animation: wxglance 6s ease-in-out infinite\"><\/div>\n<div style=\"position: absolute; left: 246px; top: 244px; width: 68px; height: 36px; border-radius: 18px; background: #F4F4F2; animation: wxglance 6s ease-in-out infinite\"><\/div>\n<\/div>";

let __schedule = () => {};
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(u) {
    const next = typeof u === 'function' ? u(this.state, this.props) : u;
    this.state = Object.assign({}, this.state, next);
    __schedule();
  }
}

class Component extends DCLogic {
renderVals() {
const colors = { idle: '#888888', working: '#2EE85E', waiting: '#FFC14D', done: '#4FA9FF', error: '#FF3A3A' };
return { mood: colors[this.props.mood] || '#2EE85E' };
}
}

(function () {
  const root = document.getElementById('face');
  const q = new URLSearchParams(location.search);
  if (q.get('embed') === '1') document.body.classList.add('embed');
  const coerce = (d, v) => d.editor === 'boolean' ? (v === true || v === 'true' || v === '1') : d.editor === 'range' ? Number(v) : v;
  const props = {};
  for (const [k, d] of Object.entries(SCHEMA)) {
    if (k[0] === '$') continue;
    props[k] = q.has(k) ? coerce(d, q.get(k)) : d.default;
  }
  const comp = typeof Component === 'function' ? new Component(Object.assign({}, props)) : null;
  let last = null, pending = false;
  const render = () => {
    pending = false;
    const vals = Object.assign({}, props, comp && comp.renderVals ? (comp.renderVals() || {}) : {});
    const out = TEMPLATE.replace(/\{\{(\w+)\}\}/g, (m, k) => (vals[k] == null ? '' : String(vals[k])));
    if (out !== last) { root.innerHTML = out; last = out; }
  };
  __schedule = () => { if (!pending) { pending = true; Promise.resolve().then(render); } };
  render();
  if (comp && comp.componentDidMount) comp.componentDidMount();
  window.addEventListener('pagehide', () => { if (comp && comp.componentWillUnmount) comp.componentWillUnmount(); });
  const box = document.getElementById('controls');
  const set = (k, v) => {
    props[k] = v;
    if (comp) comp.props = Object.assign({}, props);
    const u = new URL(location.href); u.searchParams.set(k, String(v)); history.replaceState(null, '', u);
    render();
  };
  for (const [k, d] of Object.entries(SCHEMA)) {
    if (k[0] === '$') continue;
    const label = document.createElement('label');
    label.textContent = k + ' ';
    let input;
    if (d.editor === 'enum') {
      input = document.createElement('select');
      for (const o of d.options) { const op = document.createElement('option'); op.value = o; op.textContent = o; input.appendChild(op); }
      input.value = props[k];
      input.onchange = () => set(k, input.value);
    } else if (d.editor === 'boolean') {
      input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!props[k];
      input.onchange = () => set(k, input.checked);
    } else if (d.editor === 'range') {
      input = document.createElement('input'); input.type = 'range';
      input.min = d.min; input.max = d.max; input.step = d.step || 1; input.value = props[k];
      const out = document.createElement('output'); out.textContent = props[k] + (d.unit || '');
      input.oninput = () => { out.textContent = input.value + (d.unit || ''); set(k, Number(input.value)); };
      label.appendChild(input); label.appendChild(out); box.appendChild(label); continue;
    } else continue;
    label.appendChild(input); box.appendChild(label);
  }
  if (!box.children.length) box.textContent = 'No props on this face.';
})();

</script>
