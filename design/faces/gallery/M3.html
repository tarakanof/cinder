<script>
const SCHEMA = {"$preview": {"width": 466, "height": 466}};
const TEMPLATE = "<div style=\"width: 466px; height: 466px; position: relative; overflow: hidden; border-radius: 50%; background: #000000; color: #F4F4F2; font-family: Montserrat, 'Avenir Next', 'Segoe UI', sans-serif; font-weight: 500\">\n<div style=\"position: absolute; inset: 0; animation: wxfadein 6s linear infinite\">\n<svg viewBox=\"0 0 466 466\" width=\"466\" height=\"466\" role=\"img\" aria-label=\"A faint outline of a vinyl record, slowly turning\" style=\"position: absolute; left: 0; top: 0;\">\n<circle cx=\"233\" cy=\"186\" r=\"122\" style=\"fill: none; stroke: #2A2A2A; stroke-width: 2\"><\/circle><circle cx=\"233\" cy=\"186\" r=\"52\" style=\"fill: none; stroke: #1C1C1C; stroke-width: 1.5\"><\/circle><circle cx=\"233\" cy=\"186\" r=\"61\" style=\"fill: none; stroke: #1C1C1C; stroke-width: 1.5\"><\/circle><circle cx=\"233\" cy=\"186\" r=\"70\" style=\"fill: none; stroke: #1C1C1C; stroke-width: 1.5\"><\/circle><circle cx=\"233\" cy=\"186\" r=\"79\" style=\"fill: none; stroke: #1C1C1C; stroke-width: 1.5\"><\/circle><circle cx=\"233\" cy=\"186\" r=\"88\" style=\"fill: none; stroke: #1C1C1C; stroke-width: 1.5\"><\/circle><circle cx=\"233\" cy=\"186\" r=\"97\" style=\"fill: none; stroke: #1C1C1C; stroke-width: 1.5\"><\/circle><circle cx=\"233\" cy=\"186\" r=\"106\" style=\"fill: none; stroke: #1C1C1C; stroke-width: 1.5\"><\/circle><circle cx=\"233\" cy=\"186\" r=\"115\" style=\"fill: none; stroke: #1C1C1C; stroke-width: 1.5\"><\/circle><circle cx=\"233\" cy=\"186\" r=\"40\" style=\"fill: none; stroke: #2A2A2A; stroke-width: 2\"><\/circle><circle cx=\"233\" cy=\"186\" r=\"4\" style=\"fill: #2A2A2A\"><\/circle><g style=\"transform-origin: 233px 186px; animation: wxspin 24s linear infinite\"><path d=\"M 233 86 A 100 100 0 0 1 314 128\" style=\"fill: none; stroke: #3A3A3A; stroke-width: 3; stroke-linecap: round\"><\/path><path d=\"M 233 286 A 100 100 0 0 1 152 244\" style=\"fill: none; stroke: #2E2E2E; stroke-width: 3; stroke-linecap: round\"><\/path><\/g>\n<\/svg>\n<div style=\"position: absolute; left: 0; top: 326px; width: 466px; display: flex; flex-direction: column; align-items: center\"><div style=\"font-size: 30px; line-height: 36px; color: #BDBDBD\">Nothing playing<\/div><div style=\"font-size: 24px; line-height: 28px; color: #6A6A6A; margin-top: 6px\">push to resume<\/div><\/div>\n<\/div>\n<\/div>";

let __schedule = () => {};
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(u) {
    const next = typeof u === 'function' ? u(this.state, this.props) : u;
    this.state = Object.assign({}, this.state, next);
    __schedule();
  }
}

class Component extends DCLogic {
renderVals() {
return {};
}
}

(function () {
  const root = document.getElementById('face');
  const q = new URLSearchParams(location.search);
  if (q.get('embed') === '1') document.body.classList.add('embed');
  const coerce = (d, v) => d.editor === 'boolean' ? (v === true || v === 'true' || v === '1') : d.editor === 'range' ? Number(v) : v;

  }

  let last = null, pending = false;
  const render = () => {
    pending = false;
    const vals = Object.assign({}, props, comp && comp.renderVals ? (comp.renderVals() || {}) : {});
    const out = TEMPLATE.replace(/\{\{(\w+)\}\}/g, (m, k) => (vals[k] == null ? '' : String(vals[k])));

  };
  __schedule = () => { if (!pending) { pending = true; Promise.resolve().then(render); } };
  render();
  if (comp && comp.componentDidMount) comp.componentDidMount();

  const set = (k, v) => {
    props[k] = v;
    if (comp) comp.props = Object.assign({}, props);
    const u = new URL(location.href); u.searchParams.set(k, String(v)); history.replaceState(null, '', u);
    render();
  };
  for (const [k, d] of Object.entries(SCHEMA)) {
    if (k[0] === '$') continue;
    const label = document.createElement('label');
    label.textContent = k + ' ';
    let input;
    if (d.editor === 'enum') {
      input = document.createElement('select');
      for (const o of d.options) { const op = document.createElement('option'); op.value = o; op.textContent = o; input.appendChild(op); }
      input.value = props[k];
      input.onchange = () => set(k, input.value);
    } else if (d.editor === 'boolean') {
      input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!props[k];
      input.onchange = () => set(k, input.checked);
    } else if (d.editor === 'range') {
      input = document.createElement('input'); input.type = 'range';
      input.min = d.min; input.max = d.max; input.step = d.step || 1; input.value = props[k];
      const out = document.createElement('output'); out.textContent = props[k] + (d.unit || '');

    } else continue;
    label.appendChild(input); box.appendChild(label);
  }
  if (!box.children.length) box.textContent = 'No props on this face.';
})();

</script>
