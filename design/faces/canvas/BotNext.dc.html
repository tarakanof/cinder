<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["idle","sleepy","working","waiting","done","error"],"default":"working"},"debug":{"editor":"boolean","default":false},"sleepAfter":{"editor":"range","min":5,"max":600,"step":5,"unit":"s","default":20},"waitingFast":{"editor":"boolean","default":true},"$preview":{"width":466,"height":466}}'>
class Component extends DCLogic {
componentDidMount() {
  this._alive = true;
  const loop = (ms) => {
    if (!this._alive) return;
    if (this._t0 == null) this._t0 = ms / 1000;
    this._stepAt(ms / 1000 - this._t0);
    this.setState({ f: ((this.state && this.state.f) || 0) + 1 });
    this._raf = requestAnimationFrame(loop);
  };
  this._raf = requestAnimationFrame(loop);
}
componentWillUnmount() { this._alive = false; cancelAnimationFrame(this._raf); }

_makeSim(seed, opts) {
  const M64 = (1n << 64n) - 1n;
  const IDLE = 0, SLEEPY = 1, WORKING = 2, WAITING = 3, ERROR = 4, DONE = 5;
  const DASH = 0, ROUND = 1, HAPPY = 2, ANGRY = 3;
  const REST_X = 0.67, REST_Y = 0.77, VIEWER_X = 0, VIEWER_Y = 0.1;
  const HOP_CURVE_LEN = 0.62, HOP_SQUASH = 0.75, PX = 1 / (233 * 0.84);
  const EIO = 0, EOB = 1;
  let rng = BigInt.asUintN(64, BigInt(seed));
  const next = () => {
    rng = (rng + 0x9E3779B97F4A7C15n) & M64;
    let z = rng;
    z = ((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n) & M64;
    z = ((z ^ (z >> 27n)) * 0x94D049BB133111EBn) & M64;
    return z ^ (z >> 31n);
  };
  const unit = () => Number(next() >> 11n) * Math.pow(2, -53);
  const range = (lo, hi) => lo + (hi - lo) * unit();
  const jitter = (a) => range(-a, a);
  const clamp01 = (u) => (u < 0 ? 0 : u > 1 ? 1 : u);
  const ease = (k, u) => {
    u = clamp01(u);
    if (k === EIO) return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    const c1 = 1.4, c3 = c1 + 1;
    return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2);
  };
  const tconst = (v) => ({ from: v, to: v, start: 0, dur: 0, e: EIO });
  const tween = (from, to, start, dur, e) => ({ from, to, start, dur, e });
  const tval = (tw, t) => {
    if (t < tw.start) return tw.from;
    if (tw.dur <= 0 || t >= tw.start + tw.dur) return tw.to;
    return tw.from + (tw.to - tw.from) * ease(tw.e, (t - tw.start) / tw.dur);
  };
  const lognormal = (median, sigma, lo, hi) => {
    let u1 = unit(); const u2 = unit();
    if (u1 < 1e-300) u1 = 1e-300;
    const n = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    const v = median * Math.exp(sigma * n);
    return v < lo ? lo : v > hi ? hi : v;
  };
  const eyesFor = (m) => (m === WAITING ? ROUND : m === DONE ? HAPPY : m === ERROR ? ANGRY : DASH);
  const lidCurve = (u, speed) => {
    const close = 0.075 * speed, hold = 0.035 * speed, open = 0.15 * speed;
    if (u <= 0) return 0;
    if (u < close) { const v = u / close; return v * v; }
    if (u < close + hold) return 1;
    if (u < close + hold + open) { const v = (u - close - hold) / open; return (1 - v) * (1 - v); }
    return 0;
  };
  const heavyCurve = (u, hold) => {
    if (u <= 0) return 0;
    if (u < 0.25) { const v = u / 0.25; return v * v; }
    if (u < 0.25 + hold) return 1;
    if (u < 0.55 + hold) return 1 - ease(EOB, (u - 0.25 - hold) / 0.3);
    return 0;
  };
  const blinkLength = () => (b.blink_kind === 1 ? 0.55 + b.blink_hold : (0.075 + 0.035 + 0.15) * b.blink_speed);
  const lerp = (a, c, k) => a + (c - a) * clamp01(k);
  const hopCurve = (u) => {
    if (u < 0.12) { const k = ease(EIO, u / 0.12); return [1 + 0.1 * k, 1 - 0.14 * k, 0]; }
    if (u < 0.30) {
      const v = (u - 0.12) / 0.18; let sx, sy;
      if (v < 0.3) { sx = lerp(1.1, 0.93, v / 0.3); sy = lerp(0.86, 1.1, v / 0.3); }
      else { sx = lerp(0.93, 1, (v - 0.3) / 0.7); sy = lerp(1.1, 1, (v - 0.3) / 0.7); }
      return [sx, sy, 0.22 * (1 - (1 - v) * (1 - v))];
    }
    if (u < 0.46) { const v = (u - 0.30) / 0.16; return [lerp(1, 0.95, v), lerp(1, 1.07, v), 0.22 * (1 - v * v)]; }
    let v = (u - 0.46) / 0.16; if (v > 1) v = 1;
    const k = Math.sin(Math.PI * v);
    return [1 + 0.1 * k, 1 - 0.12 * k, 0];
  };

  const b = {};
  const currentGaze = (t) => {
    if (!(b.gaze_start >= 0 && t < b.gaze_start + b.gaze_dur)) return [b.gaze_to_x, b.gaze_to_y];
    const k = ease(b.gaze_ease, (t - b.gaze_start) / b.gaze_dur);
    return [b.gaze_from_x + (b.gaze_to_x - b.gaze_from_x) * k, b.gaze_from_y + (b.gaze_to_y - b.gaze_from_y) * k];
  };
  const blinkInterval = () => {
    const med = { [WORKING]: 6.0, [WAITING]: 3.0, [SLEEPY]: 2.8, [ERROR]: 2.2, [DONE]: 3.2 }[b.mood] || 4.0;
    return lognormal(med, 0.45, 1.0, 12);
  };
  const fixation = () => {
    switch (b.mood) {
      case WORKING: return lognormal(0.9, 0.35, 0.35, 2);
      case WAITING: return lognormal(2.5, 0.4, 0.8, 6);
      case SLEEPY: return lognormal(8, 0.4, 4, 20);
      case ERROR: return lognormal(0.9, 0.4, 0.3, 2.5);
      case DONE: return lognormal(2.5, 0.4, 0.8, 6);
      default: return lognormal(2.2, 0.5, 0.6, 7);
    }
  };
  const lineY = () => -0.05 - 0.06 * b.rd_line;
  const newLine = () => { b.rd_steps = 3 + Math.floor(unit() * 4); b.read_x = -0.65 + jitter(0.03); };
  const workingTarget = () => {
    if (b.rd_turn) {
      b.rd_turn = false; b.rd_line = 0; b.rd_lines = 4 + Math.floor(unit() * 3); newLine();
      b.st = 'line 1/' + b.rd_lines;
      return { x: b.read_x, y: lineY(), fixMul: 1.3 };
    }
    const r = unit();
    if (r < 0.07) { b.st = 'at viewer'; return { x: VIEWER_X + jitter(0.05), y: VIEWER_Y }; }
    if (r < 0.12) { b.st = 'at Claude'; return { x: jitter(0.04), y: -0.35, fix: range(0.6, 1.0) }; }
    if (b.rd_steps <= 0 || b.read_x >= 0.7) {
      b.rd_line++;
      if (b.rd_line >= b.rd_lines) {
        b.rd_turn = true; b.st = 'page turn';
        const up = unit() < 0.5;
        return { x: jitter(0.08), y: up ? 0.3 : VIEWER_Y, fix: 1.2, blink: true };
      }
      newLine(); b.st = 'line ' + (b.rd_line + 1) + '/' + b.rd_lines + ' return';
      return { x: b.read_x, y: lineY() + jitter(0.02), fixMul: 1.3 };
    }
    if (b.read_x > -0.35 && unit() < 0.12) {
      b.read_x -= range(0.10, 0.22); b.st = 'line ' + (b.rd_line + 1) + '/' + b.rd_lines + ' regress';
      return { x: b.read_x, y: lineY() + jitter(0.02) };
    }
    b.read_x = Math.min(0.7, b.read_x + range(0.18, 0.38)); b.rd_steps--;
    b.st = 'line ' + (b.rd_line + 1) + '/' + b.rd_lines;
    return { x: b.read_x, y: lineY() + jitter(0.02) };
  };
  const nextTarget = () => {
    if (b.mood === WORKING) return workingTarget();
    const r = unit();
    switch (b.mood) {
      case IDLE: {
        if (r < 0.45) { const x = REST_X + jitter(0.1); return { x, y: REST_Y + jitter(0.08) }; }
        if (r < 0.7) { const x = VIEWER_X + jitter(0.08); return { x, y: VIEWER_Y + jitter(0.08) }; }
        const x = jitter(0.9); return { x, y: range(-0.6, 0.8) };
      }
      case WAITING: {
        if (r < 0.75) { const x = VIEWER_X + jitter(0.05); return { x, y: VIEWER_Y + jitter(0.05) }; }
        return { x: r < 0.875 ? -0.7 : 0.7, y: jitter(0.2) };
      }
      case SLEEPY: { const x = jitter(0.5); return { x, y: range(-0.5, -0.2) }; }
      case ERROR: {
        if (r < 0.45) { const x = VIEWER_X + jitter(0.08); return { x, y: VIEWER_Y + jitter(0.08), fix: lognormal(1.7, 0.3, 1.2, 2.5) }; }
        if (r < 0.7) { const x = jitter(0.15); return { x, y: -0.5 + jitter(0.1), fix: lognormal(1.7, 0.3, 1.2, 2.5) }; }
        const x = (unit() < 0.5 ? -1 : 1) * range(0.7, 0.9); return { x, y: jitter(0.3), fix: range(0.4, 0.9) };
      }
      default: {
        if (r < 0.5) { const x = 0.5 + jitter(0.08); return { x, y: 0.6 + jitter(0.06) }; }
        const x = VIEWER_X + jitter(0.06); return { x, y: VIEWER_Y + jitter(0.06) };
      }
    }
  };
  const startBlink = (t) => {
    b.blinking = true; b.blink_start = t; b.last_blink_at = t;
    b.blink_lag = range(0, 0.02);
    b.blink_speed = 1;
    b.double_blink_pending = unit() < 0.12;
    if (b.mood === SLEEPY) {
      b.blink_kind = 1; b.blink_hold = range(0.4, 1.2); b.double_blink_pending = false;
      b.next_blink_at = t + lognormal(7, 0.4, 3, 15);
    } else {
      b.blink_kind = 0;
      b.next_blink_at = t + blinkInterval();
    }
  };
  const startSaccadeTo = (t, glide, tx, ty, fix) => {
    const [fx, fy] = currentGaze(t);
    const amp = Math.hypot(tx - fx, ty - fy);
    b.gaze_from_x = fx; b.gaze_from_y = fy; b.gaze_to_x = tx; b.gaze_to_y = ty;
    b.fix_x = tx; b.fix_y = ty;
    b.gaze_start = t;
    b.gaze_dur = glide ? 0.42 : 0.025 + 0.045 * amp;
    b.gaze_ease = glide ? EIO : EOB;
    if (!glide && amp > 0.8 && !b.blinking && t - b.last_blink_at > 1.2 && unit() < 0.6) startBlink(t);
    const leanDur = glide ? 0.5 : 0.2;
    b.lean_x = tween(tval(b.lean_x, t), tx * 0.045, t + 0.03, leanDur, EIO);
    b.lean_y = tween(tval(b.lean_y, t), ty * 0.03, t + 0.03, leanDur, EIO);
    b.next_saccade_at = t + b.gaze_dur + (fix != null ? fix : fixation());
    b.next_micro_at = t + b.gaze_dur + Math.max(0.6, microGap());
  };
  const microGap = () => (b.mood === SLEEPY ? lognormal(2, 0.4, 0.8, 5) : lognormal(0.8, 0.4, 0.3, 2.5));
  const startMicro = (t) => {
    const [cx, cy] = currentGaze(t);
    const amp = range(0.012, 0.025) * (b.mood === SLEEPY ? 0.5 : 1);
    const dx = b.fix_x - cx, dy = b.fix_y - cy;
    const ang = Math.hypot(dx, dy) > 0.015 ? Math.atan2(dy, dx) + jitter(1.0) : range(0, 2 * Math.PI);

    if (g.blink && !b.blinking) startBlink(t);

  const startHop = (t, h, len) => { b.hopping = true; b.hop_start = t; b.hop_h = h; b.hop_len = len; };
  const enter = (m, t) => {
    const waking = b.mood === SLEEPY;
    b.mood = m; b.mood_since = t; b.swap_eyes_on_close = true;
    b.asleep = false;
    b.sleep_lid = tconst(0);
    if (!b.blinking || b.blink_kind === 1) { startBlink(t); b.blink_kind = 0; b.blink_speed = Math.max(b.blink_speed, 1.6); }
    else b.double_blink_pending = true;
    if (waking) b.double_blink_pending = true;
    if (m === SLEEPY) b.next_blink_at = t + lognormal(7, 0.4, 3, 15);
    const morph = 0.45;
    b.triangle = tween(tval(b.triangle, t), m === ERROR ? 1 : 0, t, morph, EIO);
    b.slump = tween(tval(b.slump, t), m === SLEEPY ? 1 : 0, t, m === SLEEPY ? 1.6 : morph, EIO);
    const badged = m === WAITING || m === DONE;
    b.badge = tween(tval(b.badge, t), badged ? 1 : 0, t + 0.1, 0.35, badged ? EOB : EIO);
    b.popping = m !== SLEEPY; b.pop_start = t;
    b.read_x = -0.6;
    b.rd_line = 0; b.rd_lines = 4 + Math.floor(unit() * 3); b.rd_turn = false; newLine();
    startSaccade(t, true);
    b.next_hop_at = Infinity; b.burst_hop_at = Infinity;
    if (m === WAITING) {
      b.w_t0 = t; b.next_hop_at = t + 0.6;
      b.next_peek_at = Infinity; b.next_nudge_at = Infinity; b.next_rem_at = Infinity; b.w_phase = 0;
    }
    if (m === DONE) { b.d_hop_at = t + 0.5; b.giggle_at = t + 1.6; b.lap_at = t + 2.2; }
    if (m === ERROR) { b.shake_at = t + 0.45; b.next_huff_at = t + 0.45 + lognormal(12, 0.35, 6, 25); b.huff_at = -Infinity; }
    b.st = '';
  };
  const init = (now) => {
    Object.assign(b, {
      mood: IDLE, eyes: DASH, swap_eyes_on_close: false, mood_since: now, sleep_after_s: 300,
      gaze_from_x: REST_X, gaze_to_x: REST_X, gaze_from_y: REST_Y, gaze_to_y: REST_Y, fix_x: REST_X, fix_y: REST_Y,
      gaze_start: -1, gaze_dur: 0, gaze_ease: EOB, next_saccade_at: now + 1, read_x: -0.6, next_micro_at: now + 0.8, micros: 0,
      blinking: false, blink_start: 0, blink_lag: 0, blink_speed: 1, blink_kind: 0, blink_hold: 0, double_blink_pending: false,
      next_blink_at: now + 0.8, last_blink_at: -Infinity,
      triangle: tconst(0), slump: tconst(0), badge: tconst(0), lean_x: tconst(0), lean_y: tconst(0), sleep_lid: tconst(0),
      popping: false, hopping: false, pop_start: 0, hop_start: 0, hop_h: 1, hop_len: 1, next_hop_at: Infinity, burst_hop_at: Infinity, burst_h: 1,
      asleep: false, breath_ph: 0, breath_per: 4.2, last_t: now, st: '',
      rd_line: 0, rd_lines: 5, rd_steps: 4, rd_turn: false,
      d_hop_at: Infinity, giggle_at: -Infinity, lap_at: -Infinity, shake_at: -Infinity, huff_at: -Infinity, next_huff_at: Infinity,
      nudge_at: -Infinity,
    });
  };
  const setMood = (m, t) => {
    if (m === b.mood || (m === IDLE && b.mood === SLEEPY)) return false;
    enter(m, t); return true;
  };
  const BREATH = { [IDLE]: 4.2, [WORKING]: 3.2, [WAITING]: 2.6, [DONE]: 3.6, [SLEEPY]: 5.5, [ERROR]: 3.0 };
  const pose = (t) => {
    const dt = Math.max(0, t - b.last_t); b.last_t = t;
    if (b.mood === IDLE && b.sleep_after_s > 0 && t - b.mood_since >= b.sleep_after_s) enter(SLEEPY, t);

  while (vw.outl.length && vw.outl[0] < t - 60) vw.outl.shift();
  const rps = vw.redraws.length / Math.min(5, Math.max(t, 0.5)), opm = vw.outl.length;

  this._v = {
    dy: vw.dy,
    ringD: vw.paths[v], ringColor, ringOpacity,
    glintDisplay: glintOn ? 'inline' : 'none', glintColor,
    glintD: 'M ' + tx.toFixed(2) + ' ' + ty.toFixed(2) + ' A ' + R.toFixed(2) + ' ' + R.toFixed(2) + ' 0 0 1 ' + hx.toFixed(2) + ' ' + hy.toFixed(2),
    gtx: tx.toFixed(2), gty: ty.toFixed(2), ghx: hx.toFixed(2), ghy: hy.toFixed(2),
    eyeL: eye[0].d, eyeR: eye[1].d, eyeLw: eye[0].w.toFixed(2), eyeRw: eye[1].w.toFixed(2),
    clipL: eye[0].clip.toFixed(2), clipR: eye[1].clip.toFixed(2),
    badgeDisplay: badgeOn ? 'inline' : 'none',
    badgeX: bx.toFixed(1), badgeY: (by + vw.dy).toFixed(1),
    gapR: badgeOn ? Math.round(0.3 * badgeK * R) : 0, dotR: badgeOn ? Math.round(0.22 * badgeK * R) : 0,
    badgeColor: RGB[vw.badgeMood],
    labelDisplay: label ? 'inline' : 'none', labelColor: RGB[vw.mood],
    markDisplay: vw.mood === sim.ERROR ? 'none' : 'inline',
    l0: this._letters[0], l1: this._letters[1], l2: this._letters[2], l3: this._letters[3], l4: this._letters[4], l5: this._letters[5],
    debugDisplay: this.props.debug ? 'inline' : 'none',
    debugLine: rps.toFixed(1) + ' redraws/s · ' + opm + ' outline/min', debugState: p.state,
  };
  this._p = p;
  return this._v;
}

renderVals() {
  if (!this._v) this._stepAt(0);
  return this._v;
}
}
</script>
